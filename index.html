 $("nt").textContent=t?t.title:"Belum ada lagu";$("ns").textContent=t?(mu.ld?"Memuat lagu…":(t.channel||"")):"Cari lagu di tab Musik";document.body.dataset.pl=mu.idx<0?"off":mu.ld?"ld":playing?"on":"off";
 const im=$("ni");t?im.src=muArt(t):im.removeAttribute("src");
 $("pp").innerHTML=mu.ld&&mu.idx>=0?'<span class="sp"></span>':playing?IC.pause:IC.play;$("nf").textContent=isFav(t)?"♥︎":"♡︎";$("nf").classList.toggle("on",!!isFav(t));
 $("sh").classList.toggle("on",mu.shuffle);$("rp").classList.toggle("on",mu.repeat>0);$("rp").textContent=mu.repeat===2?"↻1":"↻";
 try{if("mediaSession"in navigator)navigator.mediaSession.playbackState=playing?"playing":"paused"}catch(_){}npSync();
 if(!t){$("sk").value=0;$("tc").textContent=$("td").textContent="0:00";paint($("sk"))}}

 if(t.s!=="au"&&mu.retries<3){mu.retries++;const c=mu.cache.get(t.id);if(c)mu.bad.add(c.b);mu.cache.delete(t.id);muPlayAt(mu.idx,true);return}muFail(t)};

$("sh").onclick=()=>{mu.shuffle=!mu.shuffle;muUI()};$("rp").onclick=()=>{mu.repeat=(mu.repeat+1)%3;muUI()};

function toggleFav(t){const k=mu.playlist.findIndex(p=>p.id===t.id);if(k>=0)mu.playlist.splice(k,1);else mu.playlist.push({id:t.id,title:t.title||"",channel:t.channel||"",s:t.s||"yt",art:t.art||""});sv("vzPl",mu.playlist);muUI();renderMu()}

function renderMu(){const L=mu[mu.view==="res"?"res":mu.view==="q"?"queue":"playlist"],cu=muCur();
 $("tiles").hidden=mu.view!=="res";$("lt").textContent=TIT[mu.view];
 document.querySelectorAll(".side button").forEach(b=>b.classList.toggle("on",b.dataset.v===mu.view));

 if(!L.length){box.innerHTML=`<p class="sk">${mu.view==="res"?"Pilih genre di atas atau cari lagu.":mu.view==="q"?"Antrean kosong.":"Ketuk ♡ pada lagu untuk menyimpannya di sini."}</p>`;return}
 box.innerHTML=`<div class="bar2"><button class="bigp" data-a="allv" type="button" aria-label="Putar semua">${IC.play}</button></div><div class="th"><span>#</span><span>Judul</span></div>`+L.map((t,i)=>`<div class="tr${cu&&cu.id===t.id?" cur":""}"><div class="num" data-a="play" data-i="${i}"><em>${i+1}</em><u>${IC.play}</u><span class="sp"></span><span class="eqb"><i></i><i></i><i></i></span></div><img loading="lazy" alt="" src="${esc(muArt(t))}"><div class="mt" data-a="play" data-i="${i}"><b>${esc(t.title)}</b><small>${esc(t.channel)}</small></div><div class="a"><button class="ib${isFav(t)?" on":""}" data-a="fav" data-i="${i}" type="button" aria-label="Simpan">${isFav(t)?"♥︎":"♡︎"}</button>${mu.view==="q"?`<button class="ib" data-a="rm" data-i="${i}" type="button" aria-label="Hapus">✕</button>`:`<button class="ib" data-a="add" data-i="${i}" type="button" aria-label="Tambah ke antrean">＋</button>`}</div></div>`).join("")}
$("ml").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,L=mu[mu.view==="res"?"res":mu.view==="q"?"queue":"playlist"];
 if(a==="play"){if(mu.view!=="q")mu.queue=L.map(t=>({...t}));muPlayAt(i)}
 else if(a==="allv"){mu.queue=L.map(t=>({...t}));muPlayAt(0)}
 else if(a==="all"){mu.queue=mu.playlist.map(t=>({...t}));muPlayAt(0)}
 else if(a==="add"){mu.queue.push({...L[i]});toast("Ditambah ke antrean");if(mu.idx<0)muPlayAt(0)}
 else if(a==="fav")toggleFav(L[i]);
 else if(a==="rm"){mu.queue.splice(i,1);if(i<mu.idx)mu.idx--;else if(i===mu.idx){if(i<mu.queue.length){muPlayAt(i);return}muToken++;muA.pause();muA.removeAttribute("src");muA.load();mu.idx=-1;muUI()}renderMu()}};

async function mSearch(q){const err=$("me");err.textContent="";const src=$("src").value;sv("muSrcPref",src);$("lt").textContent="Mencari…";
 try{const r=src==="au"?await auSearch(q):(await ytSearch(q)).map(x=>({...x,s:"yt"}));mu.res=r.slice(0,20);mu.view="res";renderMu();if(!mu.res.length)err.textContent="Lagu tidak ditemukan."}
 catch(x){renderMu();err.textContent=src==="au"?"Gagal mencari di Audius. Periksa koneksi lalu coba lagi.":"Gagal mencari lewat YouTube (server sibuk). Coba lagi, atau ganti sumber ke Audius."}}
const GEN=[["Pop Indonesia","lagu pop indonesia terbaru","#e8115b"],["Lo-fi","lofi chill beats","#7358ff"],["Hip hop","hip hop hits","#e13300"],["Rock","rock classics","#8d67ab"],["Akustik","akustik cover indonesia","#148a08"],["EDM","edm party mix","#0d73ec"],["Dangdut","dangdut populer","#b49bc8"],["K-Pop","kpop hits","#dc148c"]];

/* ===== Lirik tersinkron (LRCLIB) & jembatan ke aplikasi APK ===== */
const NP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.VanzzPlayer;
const ly={lines:[],i:-1,open:false,key:"",st:""};
const lyClean=t=>{let n=String(t.title||"").replace(/\(.*?\)|\[.*?\]/g," ").replace(/\b(official|lirik|lyrics?|video|audio|mv|hd|hq|clip)\b/gi," ").replace(/\s+/g," ").trim(),a=String(t.channel||"").replace(/\s*-\s*topic$/i,"").replace(/vevo$/i,"").trim();
 const m=n.split(/\s[-–—|]\s/);if(m.length>=2){a=m[0].trim();n=m[1].trim()}return{a,n}};
const lyParse=x=>String(x).split("\n").flatMap(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);return m?[{t:+m[1]*60+ +m[2],x:m[3].trim()}]:[]});
async function lyLoad(t,d){ly.key=t.id;ly.lines=[];ly.i=-1;ly.st="Mencari lirik…";lyRender();const q=lyClean(t),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
 try{const r=await fetch("https://lrclib.net/api/search?q="+encodeURIComponent((q.a?q.a+" ":"")+q.n),{signal:ctl.signal});const j=await r.json();if(ly.key!==t.id)return;
  const f=(Array.isArray(j)?j:[]).filter(v=>v.syncedLyrics&&(!d||Math.abs((v.duration||0)-d)<=25)).sort((a,b)=>Math.abs(a.duration-d)-Math.abs(b.duration-d));
  if(f[0])ly.lines=lyParse(f[0].syncedLyrics)}catch(_){}finally{clearTimeout(tm)}
 if(ly.key===t.id){ly.st=ly.lines.length?"":"Lirik tidak ditemukan untuk lagu ini.";lyRender()}}
function lyRender(){const b=$("lyb");b.innerHTML=ly.lines.length?ly.lines.map((l,i)=>`<p data-i="${i}">${esc(l.x||"♪")}</p>`).join(""):`<p class="on">${esc(ly.st||"Lirik akan muncul di sini")}</p>`;if(ly.lines.length&&ly.i>=0)lyMark(ly.i)}
function lyTick(c,d){const t=muCur();if(!t||!d)return;if(ly.key!==t.id){lyLoad(t,d);return}if(!ly.lines.length)return;
 let k=-1;for(let n=0;n<ly.lines.length;n++){if(ly.lines[n].t<=c+.25)k=n;else break}if(k===ly.i)return;ly.i=k;lyMark(k)}
function lyMark(k){const ps=$("lyb").children;for(let n=0;n<ps.length;n++)ps[n].className=n===k?"on":n<k?"past":"";if(ly.open&&ps[k])ps[k].scrollIntoView({block:"center",behavior:"smooth"});lyPush(k>=0&&ly.lines[k]?ly.lines[k].x:"")}
function lyPush(line){const t=muCur();if(NP)NP.lyric({line}).catch(()=>{});
 if("mediaSession"in navigator&&t){try{const u=muArt(t);navigator.mediaSession.metadata=new MediaMetadata({title:t.title||"",artist:line||t.channel||"",artwork:u?[{src:u,sizes:"480x480",type:"image/jpeg"}]:[]})}catch(_){}}}
$("lb").onclick=()=>{ly.open=!ly.open;$("ly").hidden=!ly.open;$("lb").classList.toggle("on",ly.open);if(ly.open&&ly.i>=0)lyMark(ly.i)};
$("lyb").onclick=e=>{const p=e.target.closest("p[data-i]");if(!p||!ly.lines.length)return;const tt=ly.lines[+p.dataset.i].t;if(emb&&ytP)ytP.seekTo(tt,true);else muA.currentTime=tt};
const isPl=()=>mu.idx>=0&&(emb?!!(ytP&&ytP.getPlayerState&&ytP.getPlayerState()===1):!muA.paused);
function npSync(){if(!NP)return;const t=muCur();if(!t)return;const e=emb&&ytP&&ytP.getDuration,pos=e?ytP.getCurrentTime():muA.currentTime,dur=e?ytP.getDuration():muA.duration;
 NP.update({title:t.title||"",artist:t.channel||"",art:muArt(t),playing:isPl(),pos:isFinite(pos)?pos:0,dur:isFinite(dur)?dur:0}).catch(()=>{})}
muA.onseeked=muA.onloadedmetadata=npSync;
if(NP)NP.addListener("action",e=>{const a=e.a;if(a==="play"&&!isPl())muToggle();else if(a==="pause"&&isPl())muToggle();else if(a==="next")muNext();else if(a==="prev")muPrev();else if(a==="seek"){if(emb&&ytP)ytP.seekTo(e.pos,true);else muA.currentTime=e.pos}});
$("ovb").onclick=async()=>{if(!NP){toast("Pil lirik hanya ada di aplikasi APK.");return}
 try{const c=await NP.state(),r=await NP.overlay({enabled:!c.overlay});toast(r.needPerm?"Izinkan 'Tampil di atas aplikasi lain', lalu ketuk Pil lirik lagi.":r.enabled?"Pil lirik aktif. Muncul saat Anda keluar dari aplikasi.":"Pil lirik dimatikan.",6000)}catch(_){}};
